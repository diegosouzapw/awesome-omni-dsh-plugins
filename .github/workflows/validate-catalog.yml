name: validate-catalog

# Runs on EVERY pull request, not only the ones touching catalog paths. A path filter and a
# required status check cannot coexist: GitHub never reports a check that a filter skipped, so a
# documentation-only pull request would wait forever for a run that will never start. Validating
# an unchanged catalog costs seconds, and it is what lets this be a required check instead of an
# advisory one — a catalog pull request could merge red until now.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-validation:
    name: catalog-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # Validate with the CLI in THIS commit, not a version frozen on the registry. While the CLI
      # lived elsewhere, `npx omni-dsh-plugins@<version>` was the only way to reach it — which made
      # the catalog's required check depend on a package this repository itself publishes, so a
      # rename or a first release could not pass its own gate. Building from cli/ also means a
      # pull request that changes the validator is checked by the validator it changes.
      - name: Build the CLI from this commit
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Validate catalog
        run: node cli/dist/bin.js catalog validate --catalog .

      # The docs gate exists in the CLI but ran nowhere: every batch merge desynchronized the
      # README's "**N plugins merged.**" counter (and the schema/category parity it checks) with
      # no red anywhere. The CLI is already built two steps above, so this costs nothing extra.
      - name: Check catalog documentation
        run: node cli/dist/bin.js catalog docs-check .
